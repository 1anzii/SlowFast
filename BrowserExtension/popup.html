<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SlowFast</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><h1>SlowFast</h1><span>跟上你的节奏。</span></header>
  <main>
    <div class="screen"><div class="caption">当前网页视频</div><div id="speed">—<small>×</small></div><p id="status" role="status" aria-live="polite">选择倍速，或使用 Fn 快捷键。</p></div>
    <div class="rates" aria-label="选择倍速"><button data-rate="0.5">0.5×</button><button data-rate="0.75">0.75×</button><button data-rate="1">1×</button><button data-rate="1.25">1.25×</button><button data-rate="1.5">1.5×</button><button data-rate="2">2×</button></div>
    <div class="actions"><button data-action="slower">← 减慢</button><button data-action="reset">恢复 1×</button><button data-action="faster">加快 →</button></div>
  </main>
  <footer>Fn 快捷键需运行 SlowFast Mac 应用，并开启扩展增强模式。<br>独立使用：Control + Shift + , / . / 0</footer>
  <script src="popup.js"></script>
</body></html>
